name: build-portable-x64

on:
  workflow_dispatch:
  push:
    branches:
      - forme
    tags:
      - "*"
  pull_request:
    branches:
      - forme

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4

      - name: Publish Portable
        # 直接指向 .csproj 檔案最準確，避免路徑解析錯誤
        run: >
          dotnet publish LightBulb/LightBulb/LightBulb.csproj
          -p:Version=${{ github.ref_type == 'tag' && github.ref_name || 'custom-build' }}
          -p:CSharpier_Bypass=true
          --output ./publish/win-x64
          --configuration Release
          --runtime win-x64
          --self-contained true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightBulb-Portable-win-x64
          path: ./publish/win-x64
          if-no-files-found: error
